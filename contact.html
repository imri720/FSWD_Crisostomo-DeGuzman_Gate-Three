<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gate G3 — Contact</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
<header class="section has-background-primary has-text-white">
  <div class="container has-text-centered">
    <h1 class="title is-2">Barangay San Juan</h1>
    <img src="assets/logo.jpg" alt="Barangay San Juan Logo" class="image is-128x128" style="margin: 0 auto;">
  </div>

  <nav class="navbar" role="navigation" aria-label="main navigation">
    <div class="navbar-menu">
      <div class="navbar-start">
        <a class="navbar-item" href="index.html">About</a>
        <a class="navbar-item" href="officials.html">Officials</a>
        <a class="navbar-item" href="contact.html">Contact</a>
      </div>
    </div>
  </nav>

</header> 
</head>
    <body>
    <div class="container">
        <h2 class="title is-3">Contact Us</h2>
        <form>
          <div class="field">
            <label class="label" for="name">Name</label>
            <div class="control">
              <input class="input" type="text" id="name" name="name" required>
            </div>
          </div>

          <div class="field">
            <label class="label" for="email">Email</label>
            <div class="control">
              <input class="input" type="email" id="email" name="email" required>
            </div>
          </div>

          <div class="field">
            <label class="label" for="message">Message</label>
            <div class="control">
              <textarea class="textarea" id="message" name="message"></textarea>
            </div>
          </div>

          <div class="field">
            <div class="control">
              <button class="button is-primary" type="submit">Submit</button>
            </div>
          </div>
        </form>
      </div>

    <footer>
      <div class="section has-background-light">
        <div class="container has-text-centered">
          <p>© 2026 Barangay San Juan</p>
        </div>
      </div>
    </footer> 
    </body>
</html>
